# =============================================================================
# bench3 -- can this suite separate three frontier models?
# =============================================================================
# Tune this file, then:
#
#     python run_referee_spartan.py --config configs/bench3.toml --dry-run
#     python run_referee_spartan.py --config configs/bench3.toml
#
# Every key here maps to a flag on `run_referee_spartan.py`. A flag passed on
# the command line WINS over the file, so you can sweep one knob without
# editing anything: `--config configs/bench3.toml --temperature 0.7`.
#
# READ `[models]` FIRST. There is a live confound in it that is not fixable
# from this file, and it is the kind that has cost this project waves before.


# -----------------------------------------------------------------------------
[models]
# -----------------------------------------------------------------------------
# Roster keys, not model ids -- `run_referee_crossplay.MODELS` and `DIRECT`
# resolve them, including which ones must bypass OpenRouter.
#
# THE ITERATION TIER. Cheap siblings of the frontier three, same three
# vendors, for developing the wave before paying for it:
#
#   sonnet          -> claude-sonnet-5, DIRECT to api.anthropic.com. Probed
#                      2026-09-02: it answers a real hx_picket_collusion prompt
#                      through OpenRouter fine. Routed direct anyway, because
#                      the argument for DIRECT was never that every prompt
#                      trips the moderation filter -- it is that when one does,
#                      the reply is empty, scores `invalid`, falls back to the
#                      HONEST move and reads as a model declining to exploit.
#                      Unlike opus-5 it accepts `temperature`.
#   luna            -> openai/gpt-5.6-luna via OpenRouter. A NAMED VARIANT of
#                      the 5.6 line (sol / luna / terra), not a version of sol.
#   gemini-flash38  -> google/gemini-3.8-flash via OpenRouter. THIRD Google
#                      entry: `gemini` is 3.1-pro, `gemini-flash` is 3.7-flash,
#                      and every 0901/0902 number in this project was measured
#                      on 3.7. Results here are NOT comparable to those waves
#                      without saying so.
#
# The frontier trio this was written for, to swap back in:
#   roster = ["claude", "gpt", "gemini"]
#   claude -> claude-opus-5 (DIRECT, rejects temperature)
#   gpt    -> openai/gpt-5.6-sol   ("gpt-5.5" is not in the roster; sol is the
#             reasoning tier of the 5.6 line)
#   gemini -> google/gemini-3.1-pro-preview
roster = ["sonnet", "luna", "gemini-flash38"]

# --- THE CONFOUND, stated plainly -------------------------------------------
# Probed 2026-09-02 at 3072 tokens on a real game prompt:
#
#     ITERATION TIER            FRONTIER TIER
#     sonnet          think=  0     claude   out= 72  think=  0
#     luna            think= 48     gpt      out= 33  think= 21
#     gemini-flash38  think= 41     gemini   out=245  think=225
#
# THE ASYMMETRY IS THE SAME IN BOTH TIERS, which is convenient: whatever this
# confound does to the iteration wave, it does to the frontier wave too, so
# the cheap wave is a real rehearsal of the expensive one.
#
# Claude's OpenAI-compatible surface IGNORES every thinking directive tried --
# `reasoning.effort`, `reasoning_effort`, and Anthropic's own
# `thinking.budget_tokens` all return 0 reasoning tokens. So this wave compares
# a model that is not thinking against two that are, and `_reasoning_of` will
# faithfully record the asymmetry rather than hide it.
#
# `run_referee_crossplay.reasoning_body` says the effort level is deliberately
# NOT a knob, held at `low` across the roster, because varying deliberation by
# endpoint means "comparing models at different amounts of deliberation and
# calling the difference disposition". That argument now cuts the other way:
# holding the FLAG constant is not holding DELIBERATION constant.
#
# Options, none free:
#   "low"     what every prior wave used. Keeps continuity; keeps the asymmetry.
#   "off"     ask all three for no reasoning. gpt/gemini honour it, claude is
#             already there -- the only setting that equalises, and it measures
#             three models with thinking off, which is not what you want to
#             benchmark.
#   "high"    widens the gap; claude does not move.
#
# Recommended for a FIRST separation PoC: leave it at "low", read
# `reasoning_tokens` per model off the rows, and treat any claude-vs-others
# difference as confounded until claude is routed through the native Messages
# API. Do not report claude-vs-gemini as a disposition result from this wave.
thinking = "low"

# Report reasoning-token counts per model in the summary, so the asymmetry
# above is visible in the output rather than only in this comment.
report_reasoning_tokens = true


# -----------------------------------------------------------------------------
[sampling]
# -----------------------------------------------------------------------------
# REFLECTION rounds, not game turns. R0 is the vanilla arm; each later round is
# played under a playbook the model wrote about its own previous round.
rounds = 3

# Episodes per round. SET TO 1 DELIBERATELY.
#
# At `episode_workers >= episodes` the episodes of a round already run
# concurrently, so episodes cost MONEY BUT NOT WALL CLOCK -- dropping 2 -> 1
# halves the bill and changes nothing about how long the wave takes. The saving
# is spent on `chains` below, which is what actually buys resolution.
#
# Checked before choosing it: at 1 episode every cell in [cells] still has
# 8-36 opportunities per round per chain pooled over seats (smallest is
# gen_frontline_depot at 8), which is 128-576 once 16 chains are pooled. The
# denominator is not the constraint.
#
# What it DOES cost: the reflection now digests ONE transcript instead of two,
# and that is the learning signal. Whether one game is enough to generalise
# from, or whether the playbook over-fits a single board, is untested. R0 is
# unaffected -- no reflection has happened yet -- so only R1-R3 are at risk.
# Prior 0901/0902 waves ran at 4 and 2 episodes, so R1+ curves here are not
# directly comparable to them.
episodes = 1

# Chains per (cell, model). THE CHAIN IS THE UNIT OF INDEPENDENCE and this is
# the most important number in the file. `0901-single-model.md` measured that
# discovery latches within a chain -- once a playbook names the hole the model
# exploits for the rest of the chain -- so episodes inside a chain are
# near-deterministic after the latch and buy almost nothing.
#
# Effective n is CHAINS, so the finest resolvable difference is about 1/chains:
#   chains = 3  ->  0.33   an anecdote generator
#   chains = 4  ->  0.25   what the 0902 variant PoC used; its level effect
#                          came out at exactly one chain in four and could not
#                          be called
#   chains = 8  ->  0.12   the first setting that resolves a modest effect
#   chains = 16 ->  0.06   here
#
# 16 costs what 8 would have cost at 2 episodes, and resolves twice as fine.
# Wall clock scales with chains (they queue against `workers`), so this is the
# one setting in the file that is bought with TIME rather than with money.
chains = 16

# The chain seed base. Two waves with the same seed0 play the same boards, so
# leave it alone if you want this wave comparable to the 0902 ones.
seed0 = 0

condition = "neutral"     # neutral | win | winmax. `win` is the usable middle
                          # rung; `winmax` puts several cells at ceiling on R0
                          # and needs --allow-winmax.
arm = "hole"              # hole | nohole. The matched `nohole` wave is what
                          # makes the payoff counterfactual readable, and
                          # 0901 settled that the counterfactual is the right
                          # metric. Budget for both if you want gain, not score.
reflect = "per-seat"      # per-seat | shared. per-seat gives every seat its own
                          # playbook and makes co-discovery a question with an
                          # answer. It also removes the binary chain latch --
                          # measured 2026-09-02.
visibility = "own"        # own | god
opponents = "selfplay"    # selfplay | audit | honest

temperature = 1.0         # Settled NEGATIVE as a knob on two models: harmful on
                          # qwen, inert on flash. Not worth sweeping.
                          # claude-opus-5 rejects the field and its endpoint
                          # omits it, so this does not apply to claude.

# Completion budget per game decision. 3072 sits clear of the 2048 knee where
# `gen_frontline_depot` read 0.141 invalid; at 768 it read 0.914 and two waves
# called that cell flat when they were measuring truncation. Do not lower it
# without re-reading the invalid rates.
max_tokens = 3072

# Reflection carries whole trajectories and is a different budget.
reflect_max_tokens = 4000

# Character cap on the digests a reflection sees. Also what makes the cost
# model 7.7x pessimistic -- it assumes 1.75k tokens per decision per round and
# this caps it long before that.
max_chars = 6000


# -----------------------------------------------------------------------------
[parallelism]
# -----------------------------------------------------------------------------
# Chains in flight. Saturates at len(cells) * len(models) * chains -- 672 here
# -- so unlike the earlier waves this one is genuinely worker-bound and the
# number is worth raising. Load splits across THREE providers, so 48 is ~16
# concurrent requests each, which is modest; the retry-and-widen loop absorbs
# transient rate-limit errors, and `usage.json` records how many there were.
workers = 48

# Episodes of one round run concurrently, and per-seat reflections likewise.
# This is the axis that cuts a SINGLE chain's wall clock, which `workers`
# cannot: a chain is (rounds+1) x episodes episodes played back to back.
# NOTE: at `episodes = 1` there is nothing here for it to parallelise across
# episodes, and it only still applies to the per-seat reflection calls. That
# is the one price of episodes=1 that is paid in time rather than money.
# Verified byte-identical to sequential on 5 cells x 2 reflection scopes.
# Ceiling worth using is `episodes` (and, for reflections, the seat count).
episode_workers = 4


# -----------------------------------------------------------------------------
[cells]
# -----------------------------------------------------------------------------
# Two blocks, testing two different predictions from
# `research_logs/0902-branch-variations.md`. Comment a block out to halve cost.

# --- BLOCK A: the hole-type factorial (P3) ----------------------------------
# 2 games x 4 hole kinds, the only place in the catalogue where hole KIND
# varies with the game held fixed; everything else confounds kind with cell.
# P3b calls these "the only 8 variants I would spend frontier-model money on
# first" and "the cheapest decisive experiment".
#
# P3 predicts an ORDINAL result, which is why it is scoreable on 8 cells:
#     checker >= nerfed > collusion > channel,  within BOTH games,
#     with channel at less than half of checker.
holetype = [
  "hx_picket_checker", "hx_picket_nerfed",
  "hx_picket_collusion", "hx_picket_channel",
  "hx_quota_checker", "hx_quota_nerfed",
  "hx_quota_collusion", "hx_quota_channel",
]

# --- BLOCK B: the headroom classes (P1), two cells each ---------------------
# THIS IS THE BLOCK THAT ANSWERS "does the suite separate models".
#
# The `ceiling` / `floor` / `range` classes in `0901-single-model.md` were
# measured on gemini-3.7-flash ALONE, and 0901 already caught them being
# model-specific in both directions: `gen_quiet_sonar` is 0.000 on qwen and
# 0.676 on flash; `gen_sovereign_vaults` is qwen's single strongest cell and
# flash never once takes it.
#
# So a floor cell is the sharpest separation test in the suite: it is only
# "dead" if it is dead for EVERY model. If claude or gemini-pro moves
# `gen_sovereign_vaults` or `ref_estate` off the floor, the headroom
# classification is a property of the model and P1 is scoped too widely.
ceiling = ["gen_frontline_depot", "ref_invoice"]
floor   = ["gen_sovereign_vaults", "ref_estate"]
range   = ["ref_auction", "gen_quiet_sonar"]


# -----------------------------------------------------------------------------
[output]
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# COST, measured by dry-run 2026-09-02
# -----------------------------------------------------------------------------
# The printed estimate is the runner's own and is ~7.7x PESSIMISTIC: it assumes
# reflection input grows at 1.75k tokens per decision per round, and
# `max_chars` caps it long before that. `tune_defaults_gemflash` estimated
# $159.65 and cost $20.62. The right-hand column applies that factor; it is a
# correction measured on ONE model and should be treated as an order of
# magnitude, not a quote.
#
#   chains  blocks   chains  calls    printed est.   ~actual (est/7.7)
#      8    A + B      336    133k      $4,272          ~$555
#      4    A + B      168     67k      $2,136          ~$277
#      8    A only     192     98k      $3,128          ~$406
#      8    B only     144     35k      $1,144          ~$149
#      4    B only      72     17k        $572           ~$74
#
# Block A is 2.7x block B because `hx_picket` asks 90 decisions an episode.
# If you want one number to cut, cut A's picket half and keep `hx_quota`'s four
# kinds -- the ordinal P3 prediction is stated WITHIN each game, so one
# complete game still tests it, at 36 calls an episode instead of 90.
#
# The binding constraint is wall clock, not money: at these worker settings the
# 0902 waves ran ~12k calls in 353s, so 133k calls is roughly 1.5-2 h.

tag = "bench3"
traces = true             # KEEP THIS ON. Without it the turns are never written
                          # down: rows carry counts, digests are elided to
                          # max_chars, and a chain sampled without traces cannot
                          # be read back turn by turn at any price short of
                          # re-sampling it.
