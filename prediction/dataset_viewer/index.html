<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prediction · Dataset explorer</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body>
<header class="topbar"><a href="/" class="brand">P<span>↗</span> <span>Prediction lab</span></a><span class="topnote">Dataset explorer <span class="dot"></span> Recorded data</span></header>
<div class="shell">
<aside class="sidebar">
  <div class="sidebar-head"><p class="eyebrow">THE DATASET</p><h1>Inputs &amp; outcomes</h1><p id="counts" class="muted">Loading dataset…</p></div>
  <div class="filters">
    <label for="search">Search contexts</label><input id="search" type="search" placeholder="Game, model, or payoff…">
    <label for="partition">Dataset</label><select id="partition"><option value="">All recorded data</option value="train">Training · 72 games</option><option value="development">Development · 21 games</option></select>
    <label for="family">Game family</label><select id="family"><option value="">All families</option></select>
    <div class="filter-pair"><div><label for="model">Focal model</label><select id="model"><option value="">All models</option></select></div><div><label for="opponent">Opponent</label><select id="opponent"><option value="">All models</option></select></div></div>
    <button id="reset" class="text-button">Reset filters</button>
  </div>
  <div class="list-heading"><span id="matches">Contexts</span><span>Observed action 0</span></div>
  <div id="context-list" class="context-list" aria-label="Dataset contexts"></div>
  <div class="pagination"><button id="previous" class="quiet">← Previous</button><span id="page"></span><button id="next" class="quiet">Next →</button></div>
</aside>
<main id="main" aria-live="polite"><div class="empty">Choose a context to inspect the exact input and its observed outputs.</div></main>
</div>
<div id="toast" role="status" hidden></div>
</body></html>
