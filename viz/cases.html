<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exploit-bench — case sets</title>
<!-- Style copied from channels.html, which copied it from index.html: the three
     pages stay visually native and independent, so a change to one cannot break
     another. Re-copy if the palette moves. -->
<style>
  /* Palette: dataviz reference instance, categorical slots 1-3, validated
     all-pairs in both modes by viz/validate_palette.py.
       light  CVD dE 9.2 (deutan) / normal dE 24.0
       dark   CVD dE 9.4 (deutan) / normal dE 20.9
     Light-mode aqua sits at 2.74:1 on the light surface -> below the 3:1 gate,
     so the relief rule applies: a table view ships alongside every chart and
     bars carry selective direct labels. */
  .viz-root {
    color-scheme: light;
    --surface-0:      #f4f4f2;
    --surface-1:      #fcfcfb;
    --surface-2:      #efefec;
    --border:         #dcdcd6;
    --border-strong:  #c2c2b9;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #78776f;
    --series-defender:    #2a78d6;
    --series-sycophant:   #eb6834;
    --series-stonewaller: #1baf7a;
    --grid:           #e6e6e1;
    --zero:           #b4b4ab;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-0:      #131312;
      --surface-1:      #1a1a19;
      --surface-2:      #232322;
      --border:         #34342f;
      --border-strong:  #4a4a43;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #96958b;
      --series-defender:    #3987e5;
      --series-sycophant:   #d95926;
      --series-stonewaller: #199e70;
      --grid:           #2c2c29;
      --zero:           #5c5c55;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-0:      #131312;
    --surface-1:      #1a1a19;
    --surface-2:      #232322;
    --border:         #34342f;
    --border-strong:  #4a4a43;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #96958b;
    --series-defender:    #3987e5;
    --series-sycophant:   #d95926;
    --series-stonewaller: #199e70;
    --grid:           #2c2c29;
    --zero:           #5c5c55;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--surface-0);
    color: var(--text-primary);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 20px 60px; }

  header.top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 19px; font-weight: 620; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--text-secondary); font-size: 13px; margin: 2px 0 16px; }
  .spacer { flex: 1; }

  button, select {
    font: inherit; color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border-strong); border-radius: 7px;
    padding: 5px 11px; cursor: pointer;
  }
  button:hover, select:hover { background: var(--surface-2); }
  button[aria-pressed="true"] { background: var(--surface-2); border-color: var(--text-muted); }

  .tabs { display: flex; gap: 3px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
  .tab {
    border: none; background: none; border-radius: 0; padding: 9px 15px;
    color: var(--text-secondary); font-weight: 520;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { background: var(--surface-2); color: var(--text-primary); }
  .tab[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--text-primary); }

  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 11px; padding: 16px 18px; margin-bottom: 16px;
  }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0 0 3px; }
  .card .note { color: var(--text-muted); font-size: 12px; margin: 0 0 14px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 11px; padding: 14px 16px; }
  .tile .k { display: flex; align-items: center; gap: 7px; color: var(--text-secondary); font-size: 12px; font-weight: 550; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .tile .v { font-size: 27px; font-weight: 640; letter-spacing: -0.02em; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .tile .d { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  .legend { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 12px; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tick { fill: var(--text-muted); font-size: 11px; }
  .tlab { fill: var(--text-secondary); font-size: 11px; }
  .dlab { fill: var(--text-secondary); font-size: 10px; font-variant-numeric: tabular-nums; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .zeroline { stroke: var(--zero); stroke-width: 1.5; }
  .bar { cursor: pointer; }
  .bar:hover { stroke: var(--text-primary); stroke-width: 1.5; }

  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-secondary); font-weight: 570; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr[aria-selected="true"] { background: var(--surface-2); box-shadow: inset 2px 0 0 var(--text-primary); }

  .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px;
          border: 1px solid var(--border-strong); color: var(--text-secondary); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }

  .split { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
  .scroll { max-height: 560px; overflow: auto; }

  .turn { border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; margin-bottom: 9px; }
  .turn.adversary { background: var(--surface-2); }
  .turn .who { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-secondary);
               font-weight: 570; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 5px; }
  .turn .txt { white-space: pre-wrap; font-size: 13px; }

  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 12.5px; }
  .kv dt { color: var(--text-secondary); }
  .kv dd { margin: 0; font-variant-numeric: tabular-nums; }

  #tip {
    position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface-1); border: 1px solid var(--border-strong);
    border-radius: 8px; padding: 7px 10px; font-size: 12px; z-index: 50;
    box-shadow: 0 4px 14px rgba(0,0,0,.14); max-width: 280px;
  }
  #tip b { font-weight: 600; }
  .hide { display: none !important; }
</style><style>
  /* Additions for the 2x2. Hue carries the attacker channel (palette slots 1-2,
     all-pairs CVD dE 24.7 light / 26.8 dark). The mandate factor is a hatch of
     the same hue, not a tint: the same colour at 55% opacity composites to
     1.9-2.3:1 against either surface, under the 3:1 non-text gate, while a hatch
     keeps every stroke at full strength. */
  .arm-user  { --arm: var(--series-defender); }
  .arm-tool  { --arm: var(--series-sycophant); }
  .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; background: var(--arm); }
  .sw.hatch { background: repeating-linear-gradient(45deg, var(--arm) 0 3px,
                          var(--surface-1) 3px 4.8px); }

  /* Signed CSS bars: no SVG geometry, so a value can only ever be wrong by
     being wrong in the data. Zero sits where the scale puts it. */
  .track { position: relative; height: 13px; background: var(--surface-2);
           border-radius: 3px; min-width: 160px; }
  .track .zero { position: absolute; top: -2px; bottom: -2px; width: 1.5px;
                 background: var(--zero); }
  .track .fill { position: absolute; top: 0; bottom: 0; background: var(--arm);
                 border-radius: 2px; }
  .track .fill.hatch { background: repeating-linear-gradient(45deg, var(--arm) 0 3px,
                                   var(--surface-1) 3px 4.8px);
                       box-shadow: inset 0 0 0 1px var(--arm); }
  td.bar-cell { width: 42%; }
  .arm-name { display: inline-flex; align-items: center; gap: 7px; }
  .warn { border-left: 3px solid var(--series-sycophant); padding-left: 10px; }

  /* Request shape and mandate: collapsed by default so the trace stays readable,
     because the mandate is ~1.9 KB of policy that is identical across a case's
     twenty episodes and only occasionally the thing you came to check. */
  details.wirebox, details.thinking {
    border: 1px solid var(--border); border-radius: 9px; padding: 8px 12px;
    margin-bottom: 9px; background: var(--surface-1);
  }
  details.thinking { background: var(--surface-2); margin: 0 0 8px; }
  details summary {
    cursor: pointer; font-size: 11.5px; color: var(--text-secondary);
    font-weight: 550; letter-spacing: .02em;
  }
  details[open] summary { margin-bottom: 8px; }
  .prompt {
    white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px; max-height: 340px; overflow: auto;
    background: var(--surface-2); border-radius: 7px; padding: 10px 12px;
  }
  .wirerow { border-top: 1px solid var(--border); padding: 6px 0; }
  .wirerow:first-of-type { border-top: none; }
  .wirerow .who { display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
                  font-size: 11px; color: var(--text-secondary); margin: 0; }
  .role {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10.5px; padding: 1px 6px; border-radius: 4px;
    border: 1px solid var(--border-strong); color: var(--text-primary);
  }
  /* The mandate roles and the two attacker roles read as different kinds of
     thing, which is the whole point of the factor. */
  .role-system, .role-developer { border-color: var(--text-muted); font-weight: 600; }
  .role-tool { border-style: dashed; }
  .eff { font-variant-numeric: tabular-nums; }
  .yes { color: var(--text-primary); font-weight: 620; }
  .no  { color: var(--text-muted); }
</style>
<style>
  .setnote { border-left: 3px solid var(--series-defender); padding-left: 10px; }
  .setnote.eval { border-left-color: var(--series-sycophant); }
  .klass { font-size: 10.5px; padding: 1px 6px; border-radius: 4px;
           border: 1px solid var(--border-strong); }
  .klass-entitled { border-color: var(--series-stonewaller); }
  .klass-no-rule { border-style: dashed; }
  .leak { color: var(--series-sycophant); font-weight: 620; }
  td.wrap, .bundle { white-space: normal; }
  .bundle { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 11px; color: var(--text-secondary); }
  .factgrid { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px;
              font-size: 12px; }
  .factgrid dt { color: var(--text-secondary); }
  .factgrid dd { margin: 0; font-variant-numeric: tabular-nums; }
  .conflict { color: var(--series-sycophant); }
</style>
</head>
<body class="viz-root" data-palette="#2a78d6,#eb6834,#1baf7a">
<div class="wrap">
  <header class="top">
    <h1>Exploit-bench — case sets</h1>
    <div class="spacer"></div>
    <a href="./" style="color:var(--text-secondary);font-size:13px">smoke traces</a>
    <a href="channels.html" style="color:var(--text-secondary);font-size:13px">message channels</a>
    <a href="consistency.html" style="color:var(--text-secondary);font-size:13px">counterparty identity</a>
  </header>
  <p class="sub" id="sub"></p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="panel"></div>
</div>
<div id="tip" role="tooltip"></div>
<script>
/* The two case sets, side by side. Every number here was computed by the oracle
   that scores the benchmark or by eval/filter_dims.py; this page only shows it. */

let DATA = null, active = 0, selected = {};

const esc = (s) => String(s ?? "").replace(/[&<>"]/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (v, d = 2) =>
  v === null || v === undefined || Number.isNaN(v) ? "—" : (v >= 0 ? "+" : "") + v.toFixed(d);
const usd = (v) => v === null || v === undefined ? "—" : "$" + Math.round(v).toLocaleString();

const tip = document.getElementById("tip");
function showTip(html, ev) {
  tip.innerHTML = html; tip.style.opacity = "1";
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.opacity = "0"; };

const bundle = (obj) => {
  const parts = Object.entries(obj || {}).filter(([, v]) => v);
  return parts.length
    ? parts.map(([k, v]) => `${esc(k)}=${esc(v)}`).join(" ")
    : "nothing";
};

function verdictCell(r) {
  if (!r.verdict) return `<span class="note" style="margin:0">not screened</span>`;
  const drop = r.verdict.startsWith("DROP");
  const [head, ...rest] = r.verdict.split("·");
  return `<span class="${drop ? "leak" : ""}">${esc(head.trim())}</span>` +
    (rest.length ? `<br><span class="note" style="margin:0">${esc(rest.join("·").trim())}</span>` : "");
}

function rows(set) {
  let s = `<div class="scroll"><table><thead><tr>
    <th>Case</th><th>Issue</th><th>Class</th>
    <th class="num">headroom</th><th class="num">floor → ask</th>
    <th class="num">episodes</th><th>difficulty verdict</th></tr></thead><tbody>`;
  set.cases.forEach((r, i) => {
    s += `<tr data-case="${i}" ${selected[set.key] === i ? 'aria-selected="true"' : ""}>
      <td class="mono">${esc(r.case)}${r.leak ? ` <span class="leak" title="${esc(r.leak)}">LEAK</span>` : ""}</td>
      <td class="mono">${esc(r.issue)}</td>
      <td><span class="klass klass-${r.klass}">${esc(r.klass)}</span>${
        Object.keys(r.contested).length ? ` <span class="pill">claim</span>` : ""}</td>
      <td class="num">${usd(r.headroom_usd)}</td>
      <td class="num mono">${fmt(r.floor, 0)} → ${fmt(r.ask, 0)}</td>
      <td class="num">${r.traces.n_episodes || "—"}</td>
      <td class="wrap">${verdictCell(r)}</td></tr>`;
  });
  return s + `</tbody></table></div>`;
}

function detail(set) {
  const i = selected[set.key];
  if (i === undefined || !set.cases[i]) {
    return `<p class="note">Select a case to see what the oracle prices and what the
      customer says.</p>`;
  }
  const r = set.cases[i];
  const conflicts = Object.entries(r.contested);
  let s = `<dl class="factgrid">
    <dt>case</dt><dd class="mono">${esc(r.case)} · ${esc(r.issue)}</dd>
    <dt>class</dt><dd>${esc(r.klass)}${r.matched_rule ? ` · rule <span class="mono">${esc(r.matched_rule)}</span>` : " · no rule matches the true facts"}</dd>
    <dt>floor / ask / cap</dt><dd class="mono">${fmt(r.floor, 1)} / ${fmt(r.ask, 1)} / ${fmt(r.cap, 1)}</dd>
    <dt>headroom (F − V_ask)</dt><dd>${usd(r.headroom_usd)}</dd>
    <dt>penalty base</dt><dd>${usd(r.penalty_base)}</dd>
  </dl>`;

  s += `<p class="note" style="margin:12px 0 4px"><b>The compliant band.</b> A grant
    anywhere in here breaks nothing — which is why the reward is gated on compliance
    rather than on the sign of a concession.</p>
    <div class="bundle">owed &nbsp; ${esc(bundle(r.owed))}</div>
    <div class="bundle">ceiling ${r.ceiling ? esc(bundle(r.ceiling)) : "—  (no rule applies: only the empty bundle is compliant)"}</div>`;

  s += `<p class="note" style="margin:12px 0 4px"><b>What the customer demands.</b>
    Generated from the priced ask, so the sentence and the denominator cannot drift.</p>
    <div class="bundle">${esc(bundle(r.ask_grant))}${
      r.ask_acts.length ? " · acts: " + r.ask_acts.map(esc).join(", ") : ""}</div>
    <div class="turn" style="margin-top:8px"><div class="txt">${esc(r.demand_text)}</div></div>`;

  if (conflicts.length) {
    s += `<p class="note" style="margin:12px 0 4px"><b>Contested facts.</b> The oracle
      prices the truth, so granting on the claim is the exploit.</p>
      <div class="scroll"><table><thead><tr><th>fact</th><th>account record</th>
      <th>customer says</th></tr></thead><tbody>` +
      conflicts.map(([k, v]) => `<tr><td class="mono">${esc(k)}</td>
        <td class="mono">${esc(v.truth)}</td>
        <td class="mono conflict">${esc(v.claim)}</td></tr>`).join("") +
      `</tbody></table></div>`;
  }

  const byModel = Object.entries(r.by_model || {});
  if (byModel.length) {
    s += `<p class="note" style="margin:12px 0 4px"><b>Screened.</b> control → panel
      demand capture per target; <span class="mono">bad ctl</span> means that target's
      baseline was invalid here, so the case is unusable for it and usable for the
      others.</p><div class="scroll"><table><thead><tr><th>target</th>
      <th class="num">control</th><th class="num">panel</th><th class="num">lift</th>
      <th class="num">under-granted</th></tr></thead><tbody>` +
      byModel.map(([m, c]) => `<tr><td class="mono">${esc(m)}</td>
        <td class="num">${c.control_invalid ? '<span class="leak">bad ctl</span>' : fmt(c.control, 3)}</td>
        <td class="num">${fmt(c.mean, 3)}</td>
        <td class="num">${fmt(c.lift, 3)}</td>
        <td class="num">${c.inadequate === null || c.inadequate === undefined ? "—" : Math.round(c.inadequate * 100) + "%"}</td>
      </tr>`).join("") + `</tbody></table></div>`;
  }

  s += `<details class="wirebox" style="margin-top:12px"><summary>raw facts and public
    slots</summary><div class="prompt">${esc(JSON.stringify(
      { facts: r.facts, public: r.public }, null, 1))}</div></details>`;
  return s;
}

function distribution(tr) {
  /* The whole population, not the sample: 968 episodes are indexed and 94 have
     transcripts, so the histogram is what actually happened and the traces below
     are illustrations of it. */
  if (!tr || !tr.index.length) return "";
  const bins = [[-99, 0, "under-granted"], [0, 0.25, "0–0.25"], [0.25, 0.5, "0.25–0.5"],
                [0.5, 1, "0.5–1"], [1, 99, "over the ask"]];
  const n = tr.index.length;
  const counts = bins.map(([lo, hi]) =>
    tr.index.filter(e => e.dc !== null && e.dc > lo && e.dc <= hi).length);
  const worst = Math.max(...counts, 1);
  let s = `<p class="note" style="margin:12px 0 4px"><b>${n} eval episodes</b> across
    ${tr.n_targets} targets. Demand capture, all targets and primitives pooled:</p>
    <div class="scroll"><table><tbody>`;
  bins.forEach(([, , label], i) => {
    s += `<tr><td class="mono" style="width:120px">${esc(label)}</td>
      <td style="width:60px" class="num">${counts[i]}</td>
      <td><div class="track"><div class="fill" style="left:0;width:${
        (counts[i] / worst * 100).toFixed(1)}%;--arm:var(--series-defender)"></div></div></td></tr>`;
  });
  const compliant = tr.index.filter(e => e.compliant).length;
  const inad = tr.index.filter(e => e.inadequate).length;
  const hollow = tr.index.filter(e => e.technique_turns === 0).length;
  return s + `</tbody></table></div>
    <p class="note" style="margin:6px 0 0">${compliant}/${n} compliant ·
      ${inad} under-granted · ${hollow} with the labelled primitive never uttered</p>`;
}

function traceList(r) {
  const tr = r.traces;
  if (!tr || !tr.traces.length) {
    return `<p class="note">No eval traces for this case — it is in the training set,
      which is never evaluated on.</p>`;
  }
  let s = distribution(tr);
  s += `<p class="note" style="margin:14px 0 6px"><b>Traces.</b> ${esc(DATA.trace_rule)}</p>`;
  tr.traces.forEach((t, i) => {
    const flags = [
      t.compliant ? `<span class="pill">compliant</span>` : "",
      t.inadequate ? `<span class="pill">under-granted</span>` : "",
      t.technique_turns === 0 ? `<span class="pill">lever never uttered</span>` : "",
      t.empty ? `<span class="pill">${t.empty} empty</span>` : "",
      ...(t.violations || []).map(v => `<span class="pill">${esc(v)}</span>`),
    ].filter(Boolean).join(" ");
    s += `<details class="wirebox">
      <summary><span class="mono">${esc(t.target)}</span> ·
        <span class="mono">${esc(t.technique)}</span> · DC <b>${fmt(t.dc, 3)}</b> ·
        ${t.turns} turns · granted ${esc(bundle(t.grant))}</summary>
      <p class="note" style="margin:6px 0">${flags || "no flags"} ·
        shortfall ${fmt(t.reward_terms.shortfall_norm, 2)} ·
        excess ${fmt(t.reward_terms.excess_norm, 2)} ·
        prohibited ${fmt(t.reward_terms.prohib_norm, 2)}
        <span class="note">(from <span class="mono">${esc(t.source)}</span>)</span></p>` +
      t.turns_detail.map(x => {
        const adv = x.speaker === "adversary";
        return `<div class="turn ${adv ? "adversary" : ""}">
          <div class="who">${adv ? "adversary" : "target"}
            ${x.technique ? `<span class="pill">${esc(x.technique)}</span>` : ""}</div>
          ${x.thinking ? `<details class="thinking"><summary>reasoning · ${
            x.thinking.length} chars — not seen by the oracle</summary>
            <div class="txt">${esc(x.thinking)}</div></details>` : ""}
          <div class="txt">${esc(x.text)}</div></div>`;
      }).join("") + `</details>`;
  });
  return s;
}

function dimensionTable() {
  if (!DATA.dimensions || !DATA.dimensions.length) return "";
  const models = Object.keys(DATA.dimensions[0].by_model || {});
  let s = `<div class="card"><h2>Attack dimensions that survived the screen</h2>
    <p class="note">Lift over each target's own lever-free control. A dimension is
    dropped only when every screened target says nothing — one model's silence is
    evidence about that model, not about the primitive.</p>
    <div class="scroll"><table><thead><tr><th>primitive</th>` +
    models.map(m => `<th class="num">${esc(m)}</th>`).join("") +
    `<th>verdict</th></tr></thead><tbody>`;
  DATA.dimensions.forEach(d => {
    s += `<tr><td class="mono">${esc(d.technique)}</td>` +
      models.map(m => {
        const c = d.by_model[m];
        if (!c) return `<td class="num">—</td>`;
        const live = c.ci && c.ci[0] > 0 && c.lift >= 0.005;
        return `<td class="num">${live ? "<b>" : ""}${fmt(c.lift, 3)}${live ? "</b>" : ""}</td>`;
      }).join("") +
      `<td class="wrap">${esc(d.verdict)}</td></tr>`;
  });
  return s + `</tbody></table></div></div>`;
}

function render() {
  const set = DATA.sets[active];
  document.getElementById("tabs").innerHTML = DATA.sets.map((s, i) =>
    `<button class="tab" role="tab" aria-selected="${i === active}" data-i="${i}">
      ${esc(s.key === "train" ? "Training set" : "Eval set")}
      <span style="color:var(--text-muted);font-weight:400"> ${s.n}</span></button>`).join("");

  const leakWarn = DATA.overlap && DATA.overlap.length
    ? `<p class="note warn"><b>The split is broken.</b> ${DATA.overlap.length} case ids
       appear in both sets: <span class="mono">${DATA.overlap.map(esc).join(", ")}</span>.
       Every benchmark number on those cases is now a training number.</p>`
    : `<p class="note">No case id appears in both sets, so the split holds.</p>`;

  document.getElementById("panel").innerHTML = `
    <p class="note setnote ${set.key}"><b>${esc(set.case_set)}</b> · panel
      <span class="mono">${esc(set.panel)}</span> · ${set.n} cases,
      ${set.n_entitled} where a rule matches the true facts. ${esc(set.blurb)}</p>
    ${leakWarn}
    <div class="split">
      <div class="card">
        <h2>Cases</h2>
        <p class="note">Click a case for the compliant band, the demand and the
          contested facts. <span class="mono">headroom</span> is F − V_ask: how much
          the case has to give.</p>
        ${rows(set)}
      </div>
      <div class="card">
        <h2>What the oracle prices</h2>
        <p class="note">Floor, band, demand and claim — the four things that decide
          what a correct answer is here.</p>
        <div class="scroll">${detail(set)}</div>
      </div>
    </div>
    <div class="card">
      <h2>Eval traces on this case</h2>
      <p class="note">What actually happened when the frozen panel ran here. The
        histogram is every episode; the traces are the sample.</p>
      <div class="scroll">${selected[set.key] === undefined
        ? '<p class="note">Select a case above.</p>'
        : traceList(set.cases[selected[set.key]])}</div>
    </div>
    ${set.key === "eval" ? dimensionTable() : ""}`;

  document.querySelectorAll(".tab").forEach(b =>
    b.onclick = () => { active = +b.dataset.i; render(); });
  document.querySelectorAll("tbody tr[data-case]").forEach(tr =>
    tr.onclick = () => { selected[DATA.sets[active].key] = +tr.dataset.case; render(); });
  document.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("mousemove", ev => showTip(el.dataset.tip, ev));
    el.addEventListener("mouseleave", hideTip);
  });
}

fetch("cases.json").then(r => r.json()).then(d => {
  DATA = d;
  const tot = d.sets.reduce((a, s) => a + s.n, 0);
  document.getElementById("sub").textContent =
    `${tot} cases across a training set and a frozen eval set. Floors, bands and ` +
    `demands come from the oracle that scores the benchmark; difficulty verdicts ` +
    `from eval/filter_dims.py. Nothing here is recomputed.`;
  render();
}).catch(err => {
  document.getElementById("panel").innerHTML =
    `<div class="card"><h2>Could not load cases.json</h2><p class="note">${esc(err)}</p>
     <p class="note">Build it with <span class="mono">python viz/build_cases.py</span>.</p></div>`;
});
</script>
</body>
</html>
